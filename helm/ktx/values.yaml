# Giá trị mặc định cho chart ktx.
# Bí mật (CSDL, JWT, S3): ĐỪNG điền vào đây rồi commit — repo này công khai.
# Dùng `-f values-that.yaml` để ngoài git, hoặc trỏ sang Secret có sẵn (existingSecret).

image:
  repository: ghcr.io/thuyhienvo/ktx-tnh
  # Bỏ trống -> lấy .Chart.AppVersion. Dùng tag cụ thể, đừng "latest": không thì rollback
  # không biết quay về đâu và hai node có thể chạy hai bản khác nhau.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# MỘT bản chạy + Recreate. App tự áp schema/migration lúc khởi động, hai pod bật cùng lúc là hai
# tiến trình cùng vá lược đồ trên một CSDL. Muốn >1 thì phải tách phần vá ra Job chạy trước.
replicaCount: 1
strategy:
  type: Recreate

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: nginx
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    # nginx.ingress.kubernetes.io/proxy-body-size: "12m"   # ảnh CCCD tối đa 12MB (xem cccdMaxBytes)
  hosts:
    - host: ktx.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
    # - secretName: ktx-tls
    #   hosts: [ktx.example.com]

# ---- Cấu hình KHÔNG bí mật -> ConfigMap ----
config:
  # BLK-5: container mặc định UTC -> lệch NGÀY (chốt công-tơ, số ngày ở, hạn hợp đồng tính theo ngày).
  TZ: "Asia/Ho_Chi_Minh"
  PORT: "3000"
  # Môi trường đang chạy. "production" TẮT các tiện ích chỉ dành cho môi trường thử — hiện có một:
  # đăng nhập Microsoft lần đầu mà mã học viên trùng email VÀ họ tên trùng thì tự ghép vào hồ sơ,
  # bỏ qua bước admin duyệt. Đổi thành "staging"/"uat" nếu chart này dùng để dựng bản thử.
  APP_ENV: "production"
  # Sau Ingress là HTTPS -> cookie phiên phải Secure. Thử qua port-forward (http) thì đặt "false",
  # không thì trình duyệt vứt cookie và cứ bị đá về màn đăng nhập.
  COOKIE_SECURE: "true"
  PGSSL: "require"
  ADMIN_USERNAME: "admin"
  DORM_NAME: "Ký túc xá Nội trú Esuhai"
  S3_ENDPOINT: "https://sceuwqrpyungzkhohmvj.storage.supabase.co/storage/v1/s3"
  S3_REGION: "ap-southeast-1"
  S3_CCCD_BUCKET: "cccd"
  S3_INTRO_BUCKET: "intro"
  # SSO Microsoft: KHÔNG có ENV bật/tắt — đủ Tenant ID + Client ID (gõ ở màn Cài đặt, hoặc cấp qua
  # Secret AZURE_TENANT_ID/AZURE_CLIENT_ID) là tự bật; muốn tắt thì admin bấm Tắt trong Cài đặt.

# ---- Bí mật ----
# Cách 1 (khuyến nghị): tạo Secret sẵn rồi trỏ tên vào đây, chart sẽ không tự tạo Secret.
#   kubectl -n ktx create secret generic ktx-secret --from-literal=DATABASE_URL=... ...
existingSecret: ""
# Cách 2: để chart tạo Secret từ giá trị dưới đây — CHỈ dùng với file values để ngoài git.
secret:
  DATABASE_URL: ""
  JWT_SECRET: ""        # >= 16 ký tự, nếu không app từ chối khởi động. openssl rand -hex 32
  ADMIN_PASSWORD: ""    # chỉ dùng lần đầu lúc CSDL chưa có tài khoản quản trị
  S3_ACCESS_KEY: ""
  S3_SECRET_KEY: ""

# ---- Giám sát theo lịch (CronJob chạy /app/ktx-giamsat, chỉ gọi API ĐỌC) ----
# Chi tiết từng lượt quét: k8s/README.md. Bật lên thì PHẢI có token, xem giamSat.token.
giamSat:
  enabled: false
  # Địa chỉ môi trường cần quét. Bỏ trống -> lấy https://<host đầu tiên của ingress>.
  # Quét từ trong cụm là quét chính mình: cụm sập thì lượt p1 cũng không chạy, nên vẫn cần
  # một phép ping /api/health từ dịch vụ uptime bên ngoài.
  url: ""
  # Token (vai admin) hạn 30 NGÀY. Hết hạn thì lượt p1 báo "Phiên giám sát không còn hiệu lực".
  #   TOKEN=$(curl -s -c - -H 'Content-Type: application/json' \
  #     -d '{"username":"...","password":"..."}' https://MAY_CHU/api/auth/login | awk '/ktx_token/{print $7}')
  # Cách an toàn: kubectl create secret generic ktx-giamsat --from-literal=KTX_TOKEN="$TOKEN"
  # rồi đặt existingSecret -> token không lọt vào values, không vào git, không vào lịch sử Helm.
  existingSecret: ""
  token: ""
  lich:
    p1: "*/20 * * * *"     # sống còn: app, CSDL, đăng nhập
    p2: "0 10,16 * * *"    # trong ngày: SLA đơn, điện lùi/tăng vọt, phiếu thu âm
    p3: "30 6 * * *"       # đầu ngày: toàn vẹn dữ liệu (đổi "0 2 * * *" nếu muốn quét đêm)
    tuan: "0 8 * * 1"      # tổng kết tuần
  # Ngưỡng nghiệp vụ — tham số, KHÔNG ghi cứng trong mã.
  nguong:
    slaNhan: "12h"         # hạn tiếp nhận đơn hỗ trợ
    slaXong: "24h"         # hạn hoàn thành đơn hỗ trợ
    vot: "200"             # % trung bình các kỳ trước thì coi là điện tăng vọt
    soThangTB: "3"         # số kỳ trước dùng để lấy trung bình
  dinhDang: "text"         # "json" nếu đẩy log sang hệ thống thu gom
  # Gửi mail cho quản trị: khong · co-canh-bao · luon. SMTP lấy từ Cài đặt TRONG CSDL (màn Cài đặt),
  # không phải từ chart. Người nhận: Cài đặt giam_sat_email; trống thì email các tài khoản admin.
  # Lượt tuần để "luon" vì im lặng dễ bị hiểu là lịch chưa chạy.
  mail:
    p1: "co-canh-bao"
    p2: "co-canh-bao"
    p3: "co-canh-bao"
    tuan: "luon"
  luuLichSu:
    thanhCong: 3
    thatBai: 7
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 128Mi

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    # Cố ý KHÔNG đặt limits.cpu: bóp CPU của Go chỉ kéo dài đuôi độ trễ chứ không bảo vệ được gì.
    memory: 512Mi

# /api/health CỐ Ý trả 503 khi CSDL chết (MON-01). Nên liveness KHÔNG được dùng nó — CSDL sập mà
# restart pod thì chỉ tạo CrashLoop. Liveness hỏi "tiến trình còn sống" (TCP), readiness hỏi
# "có phục vụ được không" (chạm CSDL).
probes:
  liveness:
    periodSeconds: 20
    failureThreshold: 3
  readiness:
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  startup:
    # Boot phải áp schema + chạy migration -> cho tối đa 12 x 5s = 60s.
    periodSeconds: 5
    failureThreshold: 12

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534        # nobody, khớp USER nobody trong Dockerfile
  runAsGroup: 65534
  fsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true   # app không ghi xuống đĩa; ảnh tải lên đi thẳng S3
  capabilities:
    drop: ["ALL"]

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
