{{/* Chỉ tạo Secret khi KHÔNG trỏ tới Secret có sẵn. Cách an toàn hơn là tạo Secret ngoài chart
     (kubectl create secret / External Secrets) rồi đặt existingSecret — bí mật không nằm trong
     values, không lọt vào git, không nằm trong lịch sử release của Helm. */}}
{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ktx.fullname" . }}
  labels:
    {{- include "ktx.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secret }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
