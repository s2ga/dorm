{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ktx.serviceAccountName" . }}
  labels:
    {{- include "ktx.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# App không gọi API của Kubernetes -> không cần token gắn sẵn vào pod.
automountServiceAccountToken: false
{{- end }}
