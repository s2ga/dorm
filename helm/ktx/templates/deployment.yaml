apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ktx.fullname" . }}
  labels:
    {{- include "ktx.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "ktx.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ktx.selectorLabels" . | nindent 8 }}
      annotations:
        {{/* Đổi ConfigMap/Secret KHÔNG tự khởi động lại pod (ENV chỉ đọc lúc chạy tiến trình).
             Băm nội dung vào annotation -> helm upgrade tự cuốn lại pod khi cấu hình đổi. */}}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "ktx.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.config.PORT | default "3000" | int }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "ktx.fullname" . }}
            - secretRef:
                name: {{ include "ktx.secretName" . }}
          {{/* Liveness đi bằng TCP, KHÔNG dùng /api/health: endpoint đó cố ý trả 503 khi CSDL chết
               (MON-01). Lấy nó làm liveness thì Supabase sập là cả cụm restart vòng lặp, mất luôn
               trang tĩnh lẫn nhật ký, mà restart chẳng cứu được CSDL. */}}
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        {{/* readOnlyRootFilesystem=true nên vẫn cần chỗ ghi tạm cho thư viện (TLS, mã hoá...). */}}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
