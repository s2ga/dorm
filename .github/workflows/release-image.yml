name: Release image (gắn tag → GHCR)

# CHỈ chạy khi ĐẨY TAG, không chạy khi push commit.
#   git tag v168 && git push origin v168
# Push commit lên main do deploy.yml lo (ảnh :latest cho Render).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  # Tag có thể trỏ vào commit chưa qua CI -> kiểm lại trước khi phát hành.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  image:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.img.outputs.ref }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # cần lịch sử đầy đủ để biết tag có nằm trên main không

      - name: Tên ảnh + tag
        id: img
        run: |
          # GHCR bắt buộc chữ thường; ${VAR,,} là cú pháp hạ chữ của bash.
          name="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="${GITHUB_REF_NAME}"
          {
            echo "name=$name"
            echo "tag=$tag"
            echo "ref=$name:$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Tag có nằm trên main không (chỉ ghi nhận, không chặn)
        run: |
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main 2>/dev/null; then
            echo "TREN_MAIN=1" >> "$GITHUB_ENV"
            echo "Commit của tag nằm trên main."
          else
            echo "TREN_MAIN=0" >> "$GITHUB_ENV"
            echo "::warning::Tag ${GITHUB_REF_NAME} trỏ vào commit KHÔNG nằm trên main — vẫn phát hành, nhưng bản này chưa qua CI của nhánh main."
          fi

      # tag vNN phải khớp ?v=NN và ktx-shell-vNN, không thì service worker giữ asset cũ sau deploy.
      - name: Đối chiếu tag với phiên bản asset
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+$'; then
            echo "Tag '$tag' không theo dạng vNN — bỏ qua bước đối chiếu asset."
            exit 0
          fi
          so="${tag#v}"
          html=$(grep -o '?v=[0-9]\+' public/index.html | head -1 | cut -d= -f2)
          sw=$(grep -o "ktx-shell-v[0-9]\+" public/sw.js | head -1 | sed 's/.*-v//')
          echo "tag=$so · index.html=?v=$html · sw.js=ktx-shell-v$sw"
          if [ "$so" != "$html" ] || [ "$so" != "$sw" ]; then
            echo "::error::Tag $tag không khớp phiên bản asset (index.html=$html, sw.js=$sw). Bump ?v và ktx-shell-v cho khớp rồi đặt lại tag."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Đăng nhập GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # imagePullPolicy: IfNotPresent -> node đã cache tag thì không kéo lại. Tag ảnh phải bất biến.
      - name: Chặn ghi đè tag đã có
        run: |
          if docker buildx imagetools inspect "${{ steps.img.outputs.ref }}" >/dev/null 2>&1; then
            echo "::error::${{ steps.img.outputs.ref }} ĐÃ TỒN TẠI trên GHCR. Tag ảnh là bất biến — đặt tag MỚI thay vì ghi đè (xoá tag rồi đẩy lại cũng không nên: node đã cache thì không kéo lại)."
            exit 1
          fi
          echo "Tag chưa có trên GHCR — phát hành được."

      # Không cần QEMU: Dockerfile biên dịch chéo bằng $BUILDPLATFORM + $TARGETARCH.
      - name: Build & push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # Không có :latest — tag phát hành phải cố định để rollback biết quay về đâu.
          tags: |
            ${{ steps.img.outputs.ref }}
            ${{ steps.img.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Quản lý ký túc xá Nội trú
            org.opencontainers.image.version=${{ steps.img.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ghi tóm tắt + lệnh triển khai
        run: |
          {
            echo "## Đã phát hành \`${{ steps.img.outputs.tag }}\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Ảnh | \`${{ steps.img.outputs.ref }}\` |"
            echo "| Digest | \`${{ steps.build.outputs.digest }}\` |"
            echo "| Kiến trúc | linux/amd64 · linux/arm64 |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Trên main | $([ "$TREN_MAIN" = 1 ] && echo 'có' || echo '**KHÔNG** — chưa qua CI nhánh main') |"
            echo
            echo "### Triển khai"
            echo '```bash'
            echo "kubectl -n dorm set image deploy/knt knt=${{ steps.img.outputs.ref }}"
            echo "kubectl -n dorm rollout status deploy/knt"
            echo '```'
            echo
            echo "Ghim theo digest (chắc nhất, không phụ thuộc tag):"
            echo '```bash'
            echo "kubectl -n dorm set image deploy/knt knt=${{ steps.img.outputs.name }}@${{ steps.build.outputs.digest }}"
            echo '```'
            echo
            echo "> Lần đầu dùng ảnh này: mở **repo → Packages → đổi visibility sang Public**, hoặc khai imagePullSecret cho namespace \`dorm\`."
          } >> "$GITHUB_STEP_SUMMARY"
