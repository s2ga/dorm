name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # DP-01: cổng test — build & push image CHỈ chạy khi test Go xanh.
  # (Lưu ý: Render đang autoDeploy TỪ SOURCE nên job này chưa chặn được Render; muốn chặn thật
  #  owner phải đặt render.yaml autoDeploy:false + bật deploy hook gated. Xem .agents/bl_41.md.)
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  # ĐÃ GỠ job dom-smoke (30/07/2026). Nó do một phiên trợ lý TỰ THÊM ở 9c05173 — không ai yêu cầu —
  # rồi đặt luôn làm cổng chặn build-and-deploy. Hậu quả: JWT_SECRET của nó chỉ 14 ký tự mà app đòi
  # ≥16, nên job KHÔNG BAO GIỜ chạy nổi; 8 lần chạy CI liên tiếp đỏ và bước build ảnh bị skipped.
  # Ngoài ra assert bên trong phụ thuộc dữ liệu (thẻ "cần xử lý" chỉ bấm được khi số đếm > 0) nên trên
  # CSDL rỗng của CI thì kiểu gì cũng đỏ. Bộ test DOM còn ở tests/dom/ — chạy tay bằng npm run test:dom.

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name (lowercase)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build & push image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Bước deploy Render đã TẮT: để Render tự bắt commit và deploy ---
      # - name: Trigger Render deploy
      #   env:
      #     HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      #   run: |
      #     if [ -n "$HOOK" ]; then
      #       curl -fsSL -X POST "$HOOK"
      #     fi

      - name: Xong
        run: echo "Image đã đẩy lên GHCR:${{ steps.img.outputs.name }}:latest — Render tự deploy."
